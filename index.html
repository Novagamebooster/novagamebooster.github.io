<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NOVA GAME BOOSTER</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030509">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NOVA">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .game-card {
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease !important;
            will-change: transform;
            cursor: pointer;
        }
        .game-card.active {
            border-color: #a855f7 !important;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4) !important;
        }
    </style>
</head>
<body data-theme="neon">

    <div id="novaSplash" class="splash-screen">
        <div class="logo"><span>N</span>OVA</div>
        <div class="splash-loader"></div>
    </div>

    <!-- Header -->
    <header class="app-header">
        <div class="logo"><span>N</span>OVA</div>
        <div class="user-profile-badge" id="profileBadge">
            <span id="headerUsername">مهمان</span>
            <span id="vipBadge" class="vip-tag" style="display: none;">VIP</span>
        </div>
    </header>

    <!-- Main Content Tabs -->
    <main class="content-area">

        <!-- TAB 1: BOOSTER -->
        <section id="tab-booster" class="tab-content active">
            <div class="card">
                <div class="section-title">
                    <h2>🎮 انتخاب بازی</h2>
                    <span>GAMES</span>
                </div>
                <div class="games-grid" id="gamesGrid">
                    <div class="game-card active" data-game="pubg">
                        <div class="game-icon">🎯</div>
                        <span>PUBG Mobile</span>
                    </div>
                    <div class="game-card" data-game="codm">
                        <div class="game-icon">💥</div>
                        <span>Call of Duty</span>
                    </div>
                    <div class="game-card" data-game="freefire">
                        <div class="game-icon">🔥</div>
                        <span>Free Fire</span>
                    </div>
                    <div class="game-card" data-game="general">
                        <div class="game-icon">⚡</div>
                        <span>سایر بازی‌ها</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="section-title">
                    <h2>🚀 بهینه‌سازی سریع</h2>
                    <span>BOOST</span>
                </div>
                <button id="startBoostBtn" class="btn-primary" style="width:100%;">
                    شروع بهینه‌سازی (Boost)
                </button>
            </div>
        </section>

        <!-- TAB 2: SETTINGS / PROFILE -->
        <section id="tab-settings" class="tab-content">
            <div class="card">
                <div class="section-title">
                    <h2>⚙️ تنظیمات حساب کاربری</h2>
                    <span>PROFILE</span>
                </div>
                
                <div class="input-group">
                    <label>نام کاربری</label>
                    <input type="text" id="username" placeholder="نام کاربری شما">
                </div>

                <div class="input-group">
                    <label>ایمیل</label>
                    <input type="email" id="email" disabled placeholder="ایمیل کاربر">
                </div>

                <button id="saveProfile" class="btn-primary" style="width:100%; margin-top:10px;">ذخیره تغییرات</button>
            </div>

            <div class="card">
                <button id="logoutBtn" class="btn-danger" style="width:100%;">
                    خروج از حساب کاربری
                </button>
            </div>
        </section>

    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-tab="tab-booster">
            <span class="nav-icon">🚀</span>
            <span>بوستر</span>
        </button>
        <button class="nav-item" data-tab="tab-settings">
            <span class="nav-icon">⚙️</span>
            <span>تنظیمات</span>
        </button>
    </nav>

    <div id="toast" class="toast"></div>

    <script type="module">
        import { initSupabase, updateProfile, getSession, getUserRole, signOut } from './js/auth.js';

        let selectedGame = 'pubg';

        const sanitizeInput = (str) => String(str).replace(/[&<>"']/g, '');

        document.addEventListener('DOMContentLoaded', async () => {
            setTimeout(() => {
                const splash = document.getElementById('novaSplash');
                if (splash) splash.style.display = 'none';
            }, 800);

            try {
                await initSupabase();
                await loadUserProfile();
                await checkAndRenderAdminLink();
            } catch (e) {
                console.warn('Supabase init:', e);
            }

            setupNavigation();
            setupGameSelection();
            setupProfileActions();
        });

        // انتخاب سریع و بدون پرش بازی‌ها
        function setupGameSelection() {
            const grid = document.getElementById('gamesGrid');
            if (!grid) return;

            grid.querySelectorAll('.game-card').forEach(card => {
                card.addEventListener('click', () => {
                    grid.querySelectorAll('.game-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    selectedGame = card.dataset.game;
                });
            });
        }

        // سوییچ بین تب‌ها
        function setupNavigation() {
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetTab = btn.dataset.tab;
                    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                    
                    btn.classList.add('active');
                    const el = document.getElementById(targetTab);
                    if (el) el.classList.add('active');
                });
            });
        }

        // بارگذاری اطلاعات کاربر
        async function loadUserProfile() {
            try {
                const session = await getSession();
                if (!session || !session.user) return;

                const emailInput = document.getElementById('email');
                if (emailInput) emailInput.value = session.user.email || '';

                const headerUsername = document.getElementById('headerUsername');
                if (headerUsername && session.user.user_metadata?.username) {
                    headerUsername.textContent = sanitizeInput(session.user.user_metadata.username);
                }
            } catch (err) {
                console.error('Error loading profile:', err);
            }
        }

        // اکشن‌های ذخیره و خروج
        function setupProfileActions() {
            const saveBtn = document.getElementById('saveProfile');
            if (saveBtn) {
                saveBtn.addEventListener('click', async () => {
                    const u = document.getElementById('username')?.value.trim();
                    const cleanUsername = sanitizeInput(u);
                    
                    if (!cleanUsername) {
                        showToast('لطفا نام کاربری معتبر وارد کنید', true);
                        return;
                    }

                    saveBtn.disabled = true;
                    saveBtn.innerText = 'در حال ذخیره...';

                    try {
                        await updateProfile({ username: cleanUsername });
                        showToast('✅ ذخیره شد');
                        const headerUsername = document.getElementById('headerUsername');
                        if (headerUsername) headerUsername.textContent = cleanUsername;
                    } catch (err) {
                        showToast('خطا در ذخیره‌سازی', true);
                    } finally {
                        saveBtn.disabled = false;
                        saveBtn.innerText = 'ذخیره تغییرات';
                    }
                });
            }

            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async () => {
                    try {
                        await signOut();
                        window.location.reload();
                    } catch (err) {
                        showToast('خطا در خروج', true);
                    }
                });
            }
        }

        // بررسی نقش ادمین
        async function checkAndRenderAdminLink() {
            try {
                const session = await getSession();
                if (!session || !session.user) return;

                const role = await getUserRole(session.user.id);
                if (role === 'admin') {
                    const settingsTab = document.getElementById('tab-settings');
                    if (settingsTab && !document.getElementById('adminCard')) {
                        const adminCard = document.createElement('div');
                        adminCard.id = 'adminCard';
                        adminCard.className = 'card';
                        adminCard.innerHTML = `
                            <div class="section-title">
                                <h2>🛡️ پنل مدیریت</h2>
                                <span>ADMIN</span>
                            </div>
                            <a href="./admin.html" class="btn-primary" style="display:block; text-align:center; text-decoration:none;">ورود به پنل مدیریت</a>
                        `;
                        settingsTab.prepend(adminCard);
                    }
                }
            } catch (e) {}
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            if (isError) t.classList.add('error');
            else t.classList.remove('error');
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
