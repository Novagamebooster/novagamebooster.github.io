<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NOVA GAME BOOSTER</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030509">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NOVA">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .game-card {
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease !important;
            will-change: transform;
            cursor: pointer;
        }
        .game-card.active {
            border-color: #a855f7 !important;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4) !important;
        }
        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(34, 197, 94, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            z-index: 9999;
            backdrop-filter: blur(8px);
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #toast.error {
            background: rgba(239, 68, 68, 0.95);
        }
    </style>
</head>
<body data-theme="neon">
    <div id="novaSplash">
        <div class="logo splash-logo"><span>N</span>OVA</div>
        <div class="splash-loader"></div>
    </div>

    <!-- هدر اصلی -->
    <header class="app-header">
        <div class="logo"><span>N</span>OVA</div>
        <div class="user-profile-badge" id="headerProfileBadge">
            <span id="headerUsername">مهمان</span>
            <span id="vipBadge" style="display:none; background:#eab308; color:#000; font-size:10px; font-weight:900; padding:2px 6px; border-radius:6px; margin-right:5px;">VIP</span>
        </div>
    </header>

    <!-- تب‌های اصلی برنامه -->
    <main class="content-area">
        <!-- تب بوستر و انتخاب بازی -->
        <section id="tab-booster" class="tab-content active">
            <div class="card">
                <div class="section-title">
                    <h2>🎮 انتخاب بازی</h2>
                    <span>GAMES</span>
                </div>
                <div class="games-grid" id="gamesGrid">
                    <div class="game-card active" data-game="pubg">
                        <div class="game-icon">🎯</div>
                        <span>PUBG Mobile</span>
                    </div>
                    <div class="game-card" data-game="codm">
                        <div class="game-icon">💥</div>
                        <span>Call of Duty</span>
                    </div>
                    <div class="game-card" data-game="freefire">
                        <div class="game-icon">🔥</div>
                        <span>Free Fire</span>
                    </div>
                    <div class="game-card" data-game="general">
                        <div class="game-icon">⚡</div>
                        <span>سایر بازی‌ها</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="section-title">
                    <h2>🚀 بهینه‌سازی سریع</h2>
                    <span>BOOST</span>
                </div>
                <button id="startBoostBtn" class="btn-primary" style="width:100%; padding:16px; font-size:16px;">
                    شروع بهینه‌سازی (Boost)
                </button>
            </div>
        </section>

        <!-- تب تنظیمات و پروفایل -->
        <section id="tab-settings" class="tab-content">
            <div class="card">
                <div class="section-title">
                    <h2>⚙️ تنظیمات حساب کاربری</h2>
                    <span>PROFILE</span>
                </div>
                
                <div class="input-group" style="margin-bottom:12px;">
                    <label style="display:block; font-size:12px; color:#94a3b8; margin-bottom:4px;">نام کاربری</label>
                    <input type="text" id="username" placeholder="نام کاربری شما" style="width:100%; padding:10px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff;">
                </div>

                <div class="input-group" style="margin-bottom:15px;">
                    <label style="display:block; font-size:12px; color:#94a3b8; margin-bottom:4px;">ایمیل</label>
                    <input type="email" id="email" disabled placeholder="ایمیل کاربر" style="width:100%; padding:10px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05); border-radius:8px; color:#64748b; cursor:not-allowed;">
                </div>

                <button id="saveProfile" class="btn-primary" style="width:100%; padding:12px;">ذخیره تغییرات</button>
            </div>

            <!-- تنها یک دکمه خروج واحد -->
            <div class="card" id="singleLogoutCard">
                <button id="logoutBtn" class="btn-danger" style="width:100%; padding:12px; background:#ef4444; border:none; border-radius:10px; color:white; font-weight:700; cursor:pointer;">
                    خروج از حساب کاربری
                </button>
            </div>
        </section>
    </main>

    <!-- نوار ناوبری پایین -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-tab="tab-booster">
            <span class="nav-icon">🚀</span>
            <span>بوستر</span>
        </button>
        <button class="nav-item" data-tab="tab-settings">
            <span class="nav-icon">⚙️</span>
            <span>تنظیمات</span>
        </button>
    </nav>

    <div id="toast"></div>

    <script type="module">
        import { initSupabase, updateProfile, getSession, getUserRole, signOut } from './js/auth.js';

        let selectedGame = 'pubg';

        // توابع ایمن‌سازی ورودی‌ها ضد XSS
        const sanitizeInput = (str) => String(str).replace(/[&<>"']/g, '');

        document.addEventListener('DOMContentLoaded', async () => {
            setTimeout(() => {
                const splash = document.getElementById('novaSplash');
                if (splash) splash.style.display = 'none';
            }, 800);

            try {
                await initSupabase();
                await loadUserProfile();
                await checkAndRenderAdminLink();
            } catch (e) {
                console.warn('Supabase init warning:', e);
            }

            setupNavigation();
            setupGameSelection();
            setupProfileActions();
            removeDuplicateLogouts();
        });

        // ۱. انتخاب بازی بدون چشمک زدن (Fast Class Switch)
        function setupGameSelection() {
            const grid = document.getElementById('gamesGrid');
            if (!grid) return;

            grid.addEventListener('click', (e) => {
                const card = e.target.closest('.game-card');
                if (!card || card.classList.contains('active')) return;

                const current = grid.querySelector('.game-card.active');
                if (current) current.classList.remove('active');
                card.classList.add('active');
                selectedGame = card.dataset.game;
            });
        }

        // ۲. ناوبری بین تب‌ها
        function setupNavigation() {
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetTab = btn.dataset.tab;
                    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                    
                    btn.classList.add('active');
                    const el = document.getElementById(targetTab);
                    if (el) el.classList.add('active');
                });
            });
        }

        // ۳. بارگذاری اطلاعات پروفایل و تایید امنیت اشتراک
        async function loadUserProfile() {
            try {
                const session = await getSession();
                if (!session || !session.user) return;

                const emailInput = document.getElementById('email');
                if (emailInput) emailInput.value = session.user.email || '';

                const headerUsername = document.getElementById('headerUsername');
                if (headerUsername && session.user.user_metadata?.username) {
                    headerUsername.textContent = sanitizeInput(session.user.user_metadata.username);
                }
            } catch (err) {
                console.error('Error loading user profile:', err);
            }
        }

        // ۴. ذخیره امن اطلاعات بدون خطای Permission
        function setupProfileActions() {
            const saveBtn = document.getElementById('saveProfile');
            if (saveBtn) {
                saveBtn.addEventListener('click', async () => {
                    const u = document.getElementById('username')?.value.trim();
                    const cleanUsername = sanitizeInput(u);
                    
                    if (!cleanUsername) {
                        showToast('لطفا نام کاربری معتبر وارد کنید', true);
                        return;
                    }

                    saveBtn.disabled = true;
                    saveBtn.innerText = 'در حال ذخیره...';

                    try {
                        await updateProfile({ username: cleanUsername });
                        showToast('✅ پروفایل با موفقیت بروزرسانی شد');
                        const headerUsername = document.getElementById('headerUsername');
                        if (headerUsername) headerUsername.textContent = cleanUsername;
                    } catch (err) {
                        showToast('خطا در ذخیره: دسترسی غیرمجاز یا مشکل شبکه', true);
                    } finally {
                        saveBtn.disabled = false;
                        saveBtn.innerText = 'ذخیره تغییرات';
                    }
                });
            }

            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async () => {
                    try {
                        await signOut();
                        window.location.reload();
                    } catch (err) {
                        showToast('خطا در خروج از حساب', true);
                    }
                });
            }
        }

        // ۵. حذف قطعی دکمه‌های خروج تکراری
        function removeDuplicateLogouts() {
            const logouts = document.querySelectorAll('#logoutBtn, .logout-btn');
            if (logouts.length > 1) {
                for (let i = 1; i < logouts.length; i++) {
                    const card = logouts[i].closest('.card');
                    if (card) card.remove();
                    else logouts[i].remove();
                }
            }
        }

        // بررسی دسترسی مدیریت
        async function checkAndRenderAdminLink() {
            try {
                const session = await getSession();
                if (!session || !session.user) return;

                const role = await getUserRole(session.user.id);
                if (role === 'admin') {
                    const settingsTab = document.getElementById('tab-settings');
                    if (settingsTab && !document.getElementById('adminCard')) {
                        const adminCard = document.createElement('div');
                        adminCard.id = 'adminCard';
                        adminCard.className = 'card';
                        adminCard.style.borderColor = 'rgba(234,179,8,0.4)';
                        adminCard.innerHTML = `
                            <div class="section-title">
                                <h2>🛡️ پنل مدیریت سیستم</h2>
                                <span style="color:#eab308">ADMIN</span>
                            </div>
                            <a href="./admin.html" style="display:block; padding:12px; background:#eab308; border-radius:10px; color:white; text-align:center; text-decoration:none; font-weight:700;">ورود به پنل مدیریت</a>
                        `;
                        settingsTab.prepend(adminCard);
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            if (isError) t.classList.add('error');
            else t.classList.remove('error');
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
