name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Create package.json if not exists
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "nova-game-booster", "version": "1.0.0", "private": true}' > package.json
          fi

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Initialize Capacitor App
        run: |
          npx cap init "Nova Game Booster" "com.novagamebooster.app" --web-dir .
          npx cap add android

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaGameBooster-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
