name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets & Capacitor
        run: |
          mkdir -p www
          cp -r index.html www/ 2>/dev/null || true
          cp -r .well-known www/ 2>/dev/null || true
          echo '{"name": "nova-game-booster", "version": "1.0.0", "private": true}' > package.json
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Initialize & Sync Capacitor
        run: |
          npx cap init "Nova Game Booster" "com.novagamebooster.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaGameBooster-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
