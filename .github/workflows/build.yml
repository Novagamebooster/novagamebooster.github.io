name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout novagamebooster.github.io
        uses: actions/checkout@v4

      - name: Prepare Workspace Directory
        run: mkdir -p www

      - name: Clone Full Nova-booster Assets
        run: |
          git clone https://github.com/Novagamebooster/Nova-booster.git temp_repo
          cp -r temp_repo/* www/ 2>/dev/null || true
          cp -r index.html www/ 2>/dev/null || true
          cp -r *.css *.js assets www/ 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Capacitor
        run: |
          echo '{"name": "nova-game-booster", "version": "1.0.0", "private": true}' > package.json
          npm install @capacitor/cli@5.7.0 @capacitor/core@5.7.0 @capacitor/android@5.7.0

      - name: Initialize & Sync Capacitor
        run: |
          npx cap init "Nova Game Booster" "com.novagamebooster.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaGameBooster-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
