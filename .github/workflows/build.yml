name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout novagamebooster.github.io
        uses: actions/checkout@v4

      - name: Prepare Workspace Directory
        run: mkdir -p www

      - name: Clone Full Nova-booster Assets
        run: |
          git clone https://github.com/Novagamebooster/Nova-booster.git temp_repo
          cp -r temp_repo/* www/ 2>/dev/null || true
          cp -r index.html www/ 2>/dev/null || true
          cp -r *.css *.js assets www/ 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Capacitor & Assets Tools
        run: |
          echo '{"name": "nova-game-booster", "version": "1.0.0", "private": true}' > package.json
          npm install @capacitor/cli@5.7.0 @capacitor/core@5.7.0 @capacitor/android@5.7.0 @capacitor/assets@3.0.5 --save-dev

      - name: Generate Neon N Icon
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#a855f7"/>
                <stop offset="50%" stop-color="#6366f1"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
              <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#c084fc"/>
              </linearGradient>
              <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="28" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            <rect width="1024" height="1024" fill="#06070c"/>
            <circle cx="512" cy="512" r="370" fill="none" stroke="url(#ringGrad)" stroke-width="46" stroke-linecap="round" filter="url(#glow)"/>
            <text x="512" y="640" font-family="sans-serif" font-weight="900" font-size="440" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)">N</text>
          </svg>
          EOF
          rsvg-convert -w 1024 -h 1024 icon.svg -o icon.png

      - name: Initialize & Sync Capacitor with Assets
        run: |
          npx cap init "Nova Game Booster" "com.novagamebooster.app" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaGameBooster-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
