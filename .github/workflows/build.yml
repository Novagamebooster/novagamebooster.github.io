Name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Workspace Directory
        run: |
          mkdir -p www
          mkdir -p assets

      - name: Clone Full Nova-booster Assets
        run: |
          git clone https://github.com/Novagamebooster/Nova-booster.git temp_repo
          cp -r temp_repo/* www/ 2>/dev/null || true
          cp -r index.html www/ 2>/dev/null || true
          cp -r *.css *.js www/ 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Assets Generator
        run: |
          echo '{"name": "nova-game-booster", "version": "1.0.0", "private": true}' > package.json
          npm install @capacitor/cli@5.7.0 @capacitor/core@5.7.0 @capacitor/android@5.7.0 @capacitor/assets@3.0.5 --save-dev

      - name: Generate Neon N Icon & Splash Assets
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#a855f7"/>
                <stop offset="50%" stop-color="#6366f1"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
              <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#c084fc"/>
              </linearGradient>
              <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="28" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            <rect width="1024" height="1024" fill="#06070c"/>
            <circle cx="512" cy="512" r="370" fill="none" stroke="url(#ringGrad)" stroke-width="46" stroke-linecap="round" filter="url(#glow)"/>
            <text x="512" y="640" font-family="sans-serif" font-weight="900" font-size="440" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)">N</text>
          </svg>
          EOF
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon-only.png
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon-foreground.png
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon.png
          rsvg-convert -w 2732 -h 2732 icon.svg -o assets/splash.png
          rsvg-convert -w 2732 -h 2732 icon.svg -o assets/splash-dark.png

      - name: Initialize Capacitor & Build Native Android Assets
        run: |
          npx cap init "Nova Game Booster" "com.novagamebooster.app" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Inject Native VPN Core (Nova Boost)
        run: |
          cd android
          
          # 1. اضافه کردن مجوز به مانیفست
          sed -i '/<\/application>/i \        <service android:name=".NovaVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">\n            <intent-filter>\n                <action android:name="android.net.VpnService"/>\n            </intent-filter>\n        </service>' app/src/main/AndroidManifest.xml
          
          mkdir -p app/src/main/java/com/novagamebooster/app
          
          # 2. کدهای ارتباطی بین جاوا اسکریپت و جاوا
          cat << 'EOF' > app/src/main/java/com/novagamebooster/app/BoostCorePlugin.java
          package com.novagamebooster.app;
          import android.content.Intent;
          import android.net.VpnService;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "BoostCore")
          public class BoostCorePlugin extends Plugin {
              @PluginMethod
              public void startBoost(PluginCall call) {
                  Intent intent = VpnService.prepare(getContext());
                  if (intent != null) {
                      getActivity().startActivityForResult(intent, 0);
                  }
                  JSObject ret = new JSObject();
                  ret.put("status", "success");
                  call.resolve(ret);
              }
          }
          EOF
          
          # 3. فایل هسته اصلی تغییر اینترنت
          cat << 'EOF' > app/src/main/java/com/novagamebooster/app/NovaVpnService.java
          package com.novagamebooster.app;
          import android.net.VpnService;
          public class NovaVpnService extends VpnService {
              // در مرحله بعد کدهای تغییر IP و DNS اینجا اضافه می شوند
          }
          EOF
          
          # 4. آپدیت کردن اکتیویتی اصلی برنامه برای شناسایی کدهای بالا
          cat << 'EOF' > app/src/main/java/com/novagamebooster/app/MainActivity.java
          package com.novagamebooster.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(BoostCorePlugin.class);
              }
          }
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaGameBooster-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
